<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s10-root { position: absolute; inset: 0; overflow: hidden; }
        #s10-stage { position: absolute; inset: 0; background: var(--ink); }
        #s10-glow {
          position: absolute; left: 460px; top: 430px; width: 1000px; height: 640px;
          background: radial-gradient(closest-side, rgba(201, 171, 99, 0.24), rgba(201, 171, 99, 0) 70%);
          opacity: 0.4; pointer-events: none;
        }
        #s10-title { position: absolute; left: 0; right: 0; top: 92px; text-align: center; font: 500 50px/1 var(--font-head); letter-spacing: -0.01em; color: var(--ink-fg); }
        #s10-title em { font-style: italic; color: var(--accent-line); }
        #s10-tiles { position: absolute; left: 120px; top: 186px; width: 1680px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
        .s10-tile { padding: 26px 22px 24px; border: 1px solid #4a4233; border-radius: 10px; background: #2a251c; }
        .s10-n { font-size: 62px; line-height: 1; color: var(--accent-line); letter-spacing: -0.02em; }
        .s10-k { font: 600 22px/1.25 var(--font-body); color: var(--ink-fg); margin-top: 14px; }
        .s10-d { font: 400 20px/1.3 var(--font-body); color: var(--ink-muted); margin-top: 4px; }
        #s10-tests { position: absolute; left: 0; right: 0; top: 422px; text-align: center; font: 500 24px/1 var(--font-body); letter-spacing: 0.04em; color: var(--ink-muted); }
        #s10-rule { position: absolute; left: 860px; top: 506px; width: 200px; height: 1px; background: #5a5140; }
        #s10-id { position: absolute; left: 0; right: 0; top: 590px; display: flex; flex-direction: column; align-items: center; }
        #s10-brand { display: flex; align-items: center; gap: 28px; }
        #s10-mark {
          width: 104px; height: 104px; border-radius: 6px; border: 2px solid var(--accent-line); color: var(--accent-line);
          display: flex; align-items: center; justify-content: center; font: 600 60px/1 var(--font-head);
        }
        #s10-name { font: 600 92px/1 var(--font-head); letter-spacing: 0.02em; color: var(--ink-fg); }
        #s10-by { font: italic 400 42px/1.2 var(--font-head); color: var(--ink-fg); margin-top: 34px; }
        #s10-links { display: flex; gap: 40px; margin-top: 30px; font: 500 30px/1 var(--font-mono); color: var(--ink-fg); }
        #s10-links span { color: var(--accent-line); }
        #s10-stack { margin-top: 34px; font: 500 22px/1 var(--font-body); letter-spacing: 0.04em; color: var(--ink-muted); }
      </style>

      <div id="s10-root" data-composition-id="s10-outro" data-width="1920" data-height="1080">
        <div id="s10-stage">
          <div id="s10-glow"></div>
          <div id="s10-title">Measured on <em>held-out</em> tests</div>
          <div id="s10-tiles">
            <div class="s10-tile"><div class="s10-n num">38.35</div><div class="s10-k">IL-TUR macro-F1</div><div class="s10-d">LeSICiN baseline 28.08</div></div>
            <div class="s10-tile"><div class="s10-n num">0.94</div><div class="s10-k">Retrieval hit@3</div><div class="s10-d">MRR 0.86</div></div>
            <div class="s10-tile"><div class="s10-n num">0.930</div><div class="s10-k">Intent routing</div><div class="s10-d">was 0.780</div></div>
            <div class="s10-tile"><div class="s10-n num">0.938</div><div class="s10-k">Document type</div><div class="s10-d">regex 0.815</div></div>
            <div class="s10-tile"><div class="s10-n num">99 s</div><div class="s10-k">Document review</div><div class="s10-d">was ~250 s</div></div>
            <div class="s10-tile"><div class="s10-n num">1.0 s</div><div class="s10-k">First visible word</div><div class="s10-d">was 12.6 s</div></div>
          </div>
          <div id="s10-tests">370 unit tests · every figure traceable to a PR, commit or eval run</div>
          <div id="s10-rule"></div>
          <div id="s10-id">
            <div id="s10-brand"><div id="s10-mark">L</div><div id="s10-name">LawWeb</div></div>
            <div id="s10-by">An academic project by Anubhab Das</div>
            <div id="s10-links"><div>github.com/anubhab7111/lawWeb</div><span>·</span><div>anubhabdas7111@gmail.com</div></div>
            <div id="s10-stack">FastAPI · LangGraph · FAISS · BGE-M3 · Ollama · React</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const GLOBAL_START = 68.3; // this scene's slot start in index.html, for music-RMS lookup
          const FPS = 30;
          const tl = gsap.timeline({ paused: true });
          // Fade through paper: hold hidden while the previous scene fades out, then fade in.
          tl.fromTo("#s10-stage", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: (t) => (t < 0.5 ? 0 : 1 - Math.pow(2 - 2 * t, 2)) }, 0);
          tl.fromTo("#s10-title", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.4);
          tl.fromTo(".s10-tile", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.12, ease: "power2.out" }, 0.7);
          tl.fromTo("#s10-tests", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.6);
          tl.fromTo("#s10-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 2.3);
          tl.fromTo("#s10-mark", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 2.7);
          tl.fromTo("#s10-name", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 2.8);
          tl.fromTo("#s10-by", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.3);
          tl.fromTo("#s10-links", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.8);
          tl.fromTo("#s10-stack", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 4.3);

          // Audio-reactive: the gold glow behind the mark breathes with the music bed's RMS.
          const rms = window.AUDIO_RMS || [];
          for (let f = 0; f < Math.round(7.6 * FPS); f++) {
            const v = rms[Math.round(GLOBAL_START * FPS) + f];
            if (v === undefined) break;
            tl.set("#s10-glow", { opacity: 0.25 + 0.5 * v, scale: 0.96 + 0.06 * v }, f / FPS);
          }
          window.__timelines["s10-outro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
