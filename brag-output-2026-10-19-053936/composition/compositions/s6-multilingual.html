          padding: 0 16px; background: var(--surface-alt); border-bottom: 1px solid var(--border-2); }
        .ml-dot { width: 12px; height: 12px; border-radius: 99px; background: #d6ccb8; }
        .ml-url { margin-left: 14px; flex: 1; height: 28px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border);

        .ml-t { font: 600 28px/1.15 var(--font-body); color: var(--text-strong); }
        .ml-d { font: 400 22px/1.35 var(--font-mono); color: var(--text-2); margin-top: 6px; }
        #ml-card { left: 880px; top: 250px; width: 880px; height: 763px; }

      <div id="ml-root" data-composition-id="s6-multilingual" data-width="1920" data-height="1080">
        <div id="ml-stage">
          <div class="fig-head" id="ml-head">
            <div class="fig-tag">Fig. 4 · Multilingual</div>
            <div class="fig-title">Hindi in, Hindi out, <em>citations intact</em></div>
          </div>
          <div id="ml-steps">
            <div class="ml-step"><div class="ml-n num">1</div><div><div class="ml-t">Detect the language</div><div class="ml-d">fastText lid.176, offline · 16 Indian languages</div></div></div>
            <div class="ml-step"><div class="ml-n num">2</div><div><div class="ml-t">Mask citations</div><div class="ml-d">§ 41 · BNSS · AIR 1978 SC 597 → placeholders</div></div></div>
            <div class="ml-step"><div class="ml-n num">3</div><div><div class="ml-t">Translate to English</div><div class="ml-d">IndicTrans2 200M via CTranslate2, on the CPU</div></div></div>
            <div class="ml-step"><div class="ml-n num">4</div><div><div class="ml-t">Answer in English</div><div class="ml-d">the same LangGraph pipeline</div></div></div>
            <div class="ml-step"><div class="ml-n num">5</div><div><div class="ml-t">Translate back, restore</div><div class="ml-d">citations restored; a line that would lose one stays in English</div></div></div>
          </div>
          <div id="ml-cap"><div id="ml-cap-t">Live · Hindi question</div>
            <div id="ml-cap-r"><div class="ml-badge fast" id="ml-speed">waits compressed 16×</div><div id="ml-timer" class="num">typing</div></div></div>
          <div class="ml-card" id="ml-card">
            <div class="ml-bar"><div class="ml-dot"></div><div class="ml-dot"></div><div class="ml-dot"></div>
              <div class="ml-url">localhost:5173/#/chat · LawWeb</div></div>
            <div class="ml-view">
              <video id="ml-video" src="assets/live/live-hi.mp4" data-layout-allow-overflow data-hf-media-start-basis="local" data-start="0.5" data-duration="9.57" data-track-index="2" muted playsinline></video>
            </div>
          </div>
        </div>
      </div>
