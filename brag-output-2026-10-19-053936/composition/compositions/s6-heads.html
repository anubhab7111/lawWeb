<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s6-root { position: absolute; inset: 0; overflow: hidden; }
        #s6-stage { position: absolute; inset: 0; background: var(--bg); }
        .s6-card { position: absolute; top: 312px; width: 532px; height: 590px; padding: 44px 46px; display: flex; flex-direction: column; }
        .s6-k { font: 600 23px/1 var(--font-body); letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent-dark); }
        .s6-task { font: 520 46px/1.1 var(--font-head); letter-spacing: -0.015em; color: var(--text-strong); margin-top: 18px; }
        .s6-before { display: flex; align-items: baseline; gap: 14px; margin-top: 46px; }
        .s6-before .num { font-size: 50px; line-height: 1; color: var(--muted); }
        .s6-before span { font: 400 24px/1 var(--font-body); color: var(--muted); }
        .s6-arrow { font: 400 34px/1 var(--font-body); color: var(--accent-line); margin: 14px 0 6px; }
        .s6-after { font-size: 128px; line-height: 0.95; color: var(--accent); letter-spacing: -0.03em; }
        .s6-metric { font: 500 25px/1.25 var(--font-mono); color: var(--text-strong); margin-top: 18px; }
        .s6-set { font: 400 23px/1.3 var(--font-body); color: var(--text-2); margin-top: 8px; }
      </style>

      <div id="s6-root" data-composition-id="s6-heads" data-width="1920" data-height="1080">
        <div id="s6-stage">
          <div class="fig-head" id="s6-head">
            <div class="fig-tag">Fig. 6 · Trained classifiers</div>
            <div class="fig-title">Small heads on <em>BGE-M3</em> embeddings</div>
          </div>

          <div class="card s6-card" style="left:120px;">
            <div class="s6-k">vs a centroid router</div>
            <div class="s6-task">Intent routing</div>
            <div class="s6-before"><span class="num">0.780</span><span>centroid</span></div>
            <div class="s6-arrow">↓</div>
            <div class="s6-after num">0.915</div>
            <div class="s6-metric">routed accuracy</div>
            <div class="s6-set">200 test messages · real forum questions alone 0.808</div>
          </div>
          <div class="card s6-card" style="left:694px;">
            <div class="s6-k">vs regex rules</div>
            <div class="s6-task">Document type</div>
            <div class="s6-before"><span class="num">0.815</span><span>regex</span></div>
            <div class="s6-arrow">↓</div>
            <div class="s6-after num">0.938</div>
            <div class="s6-metric">accuracy</div>
            <div class="s6-set">130 test docs, 110 of them hand-written · real FIR scans 10/10</div>
          </div>
          <div class="card s6-card" style="left:1268px;">
            <div class="s6-k">new classifier</div>
            <div class="s6-task">Crime sections</div>
            <div class="s6-before"><span>dev set: 0.357 → 0.838</span></div>
            <div class="s6-arrow">&nbsp;</div>
            <div class="s6-after num">0.826</div>
            <div class="s6-metric">hit@5 · ILSIC test</div>
            <div class="s6-set">350 real lay questions · scored once</div>
          </div>

          <div class="fig-source" id="s6-src">Routing and document type re-run on Oct 14; crime sections scored once in PR #43.</div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // Fade through paper: hold hidden while the previous scene fades out, then fade in.
          tl.fromTo("#s6-stage", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: (t) => (t < 0.5 ? 0 : 1 - Math.pow(2 - 2 * t, 2)) }, 0);
          tl.fromTo("#s6-head", { y: 16 }, { y: 0, duration: 0.7, ease: "power2.out" }, 0);
          // Each card lands as the narration names it: routing, document typing, crime sections.
          tl.fromTo(".s6-card", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, stagger: 0.95, ease: "power3.out" }, 1.4);
          tl.fromTo("#s6-src", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 4.2);
          tl.to("#s6-stage", { opacity: 0, duration: 0.3, ease: "power1.in" }, 6.8);
          window.__timelines["s6-heads"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
